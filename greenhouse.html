<!doctype html><html><body><h1>Software Engineer at Acme</h1>
<form id="app" onsubmit="event.preventDefault();document.body.innerHTML='<h1>Thank you for applying! Your application has been submitted.</h1>';">
<label>First Name* <input type="text" name="job_application[first_name]" required></label>
<label>Last Name* <input type="text" name="job_application[last_name]" required></label>
<label>Email* <input type="email" name="job_application[email]" required></label>
<label>Phone <input type="tel" name="job_application[phone]"></label>
<label>Resume/CV* <input type="file" name="job_application[resume]" required></label>
<button type="submit">Submit application</button></form></body></html>
