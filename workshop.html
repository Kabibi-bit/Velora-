<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — Velora</title>
<link rel="stylesheet" href="styles.css">
<style>
.workshop-list{ max-width: 760px; }
.app-card{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
.app-top{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
.app-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 16.5px; margin: 0 0 4px; }
.app-org{ font-family:'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-faint); }
.app-status-pill{ font-family:'JetBrains Mono', monospace; font-size: 10.5px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.app-status-pill.pending_review{ color: var(--gold); background: var(--gold-dim); border:1px solid rgba(240,178,78,0.4); }
.app-status-pill.approved{ color: var(--comet); background: var(--comet-dim); border:1px solid rgba(123,169,255,0.4); }
.app-status-pill.sent{ color: var(--aurora); background: var(--aurora-dim); border:1px solid rgba(95,224,184,0.4); }
.app-status-pill.undone{ color: var(--text-faint); background: var(--line-soft); border:1px solid var(--line); }
.app-confidence{ font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.app-draft{ margin-top: 14px; padding: 16px; background: var(--void); border: 1px solid var(--line-soft); border-radius: 10px; font-family:'Manrope', sans-serif; font-size: 13.5px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
.app-actions{ display:flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.app-actions .btn{ padding: 10px 18px; font-size: 13px; }
.app-countdown{ font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); margin-top: 10px; }
.workshop-tabs{ display:flex; gap: 8px; margin-bottom: 24px; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div id="nav-root"></div>

<div class="wrap">
  <div class="page">
    <div class="page-head">
      <div class="eyebrow">Workshop</div>
      <h1>Your drafted applications</h1>
      <p>Star a match on Job Search and an AI-tailored application is drafted automatically. Review, approve, and send from here.</p>
    </div>

    <div class="workshop-tabs chip-row" id="statusFilter">
      <div class="chip active" data-val="all">All</div>
      <div class="chip" data-val="pending_review">Needs review</div>
      <div class="chip" data-val="approved">Approved</div>
      <div class="chip" data-val="sent">Sent</div>
    </div>

    <div class="workshop-list" id="workshopList"></div>
  </div>
  <footer>Velora is a demo - sending here does not submit to a real job site; see the honest note in each application.</footer>
</div>

<script src="state.js"></script>
<script src="charts.js"></script>
<script>
window.addEventListener("error", function(e){
  var msg = "Script error: " + e.message + " (in " + (e.filename ? e.filename.split("/").pop() : "unknown file") + ", line " + e.lineno + ")";
  showDiagBanner(msg);
});
function showDiagBanner(msg){
  if(document.getElementById("diagBanner")) return;
  var b = document.createElement("div");
  b.id = "diagBanner";
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;padding:14px 20px;font-family:monospace;font-size:13px;text-align:center;";
  b.textContent = "Velora failed to load correctly - " + msg + " - check that all files (especially state.js and styles.css) are uploaded with these EXACT lowercase names to the same folder.";
  document.body.prepend(b);
}
setTimeout(function(){
  if(typeof renderNav === "undefined" || typeof veloraMark === "undefined"){
    showDiagBanner("state.js did not load (its functions are undefined). Check the file exists, is named exactly state.js, and sits in the same folder as this page.");
  }
}, 800);
</script>
<script>
initStarfield();
renderNav('workshop');
localStorage.setItem('velora_role', 'candidate');

let activeFilter = 'all';
document.getElementById('statusFilter').querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#statusFilter .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.val;
    renderWorkshop();
  });
});

function timeRemaining(sendableAt){
  const diff = new Date(sendableAt) - new Date();
  if(diff <= 0) return null;
  const mins = Math.ceil(diff / 60000);
  return `${mins} minute${mins===1?'':'s'} left in the undo window`;
}

function statusLabel(status){
  return { pending_review: 'Needs review', approved: 'Approved - ready to send', sent: 'Sent', undone: 'Undone' }[status] || status;
}

function renderWorkshop(){
  const apps = getApplications();
  const filtered = activeFilter === 'all' ? apps : apps.filter(a => a.status === activeFilter);
  const list = document.getElementById('workshopList');

  if(apps.length === 0){
    list.innerHTML = `<div class="empty-state">
      <div class="glyph">&#9998;</div>
      No applications drafted yet.
      <div class="sub">Star a match on the Job Search page - an AI-tailored application will be drafted here automatically.</div>
      <a class="btn" href="dashboard.html">Go to Job Search &rarr;</a>
    </div>`;
    return;
  }
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="glyph">&#9998;</div>Nothing in this filter.<div class="sub">Try a different tab above.</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(a => {
    const remaining = a.status === 'approved' && a.sendable_at ? timeRemaining(a.sendable_at) : null;
    return `<div class="app-card" data-id="${a.id}">
      <div class="app-top">
        <div><p class="app-title">${a.listing_title}</p><div class="app-org">${a.listing_org}</div></div>
        <span class="app-status-pill ${a.status}">${statusLabel(a.status)}</span>
      </div>
      <div class="app-confidence">Match confidence: ${a.confidence_pct}% ${a.confidence_pct >= 80 ? '(auto-approved - high confidence)' : '(needs your review - below auto-send threshold)'}</div>
      <div class="app-draft">${a.draft}</div>
      ${remaining ? `<div class="app-countdown">${remaining}</div>` : ''}
      <div class="app-actions">
        ${a.status === 'pending_review' ? `<button class="btn" data-action="approve">Approve</button>` : ''}
        ${a.status === 'approved' && !remaining ? `<button class="btn" data-action="send">Send</button>` : ''}
        ${(a.status === 'approved' || a.status === 'pending_review') ? `<button class="btn ghost" data-action="undo">Discard</button>` : ''}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.app-card');
      const id = card.dataset.id;
      const action = btn.dataset.action;
      const apps = getApplications();
      const app = apps.find(a => a.id === id);
      if(!app) return;

      if(action === 'approve'){
        app.status = 'approved';
        app.sendable_at = new Date(Date.now() + UNDO_WINDOW_MINUTES * 60000).toISOString();
      } else if(action === 'send'){
        app.status = 'sent';
        app.sent_at = new Date().toISOString();
      } else if(action === 'undo'){
        app.status = 'undone';
      }
      saveApplications(apps);
      renderWorkshop();
    });
  });
}

renderWorkshop();
setInterval(renderWorkshop, 15000); // keep countdown timers fresh
</script>
</body>
</html>
